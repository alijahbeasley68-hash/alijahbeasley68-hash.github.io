name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A5B744: ${{ secrets.A5B744 }}
          B640B5: ${{ secrets.B640B5 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A5B744', '')
          meta_b = os.environ.get('B640B5', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 58c1df2662e202a3df07a54bf53703309b974de8 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- eeafb31c26bac9a29efaf0bba85032b9fd87697398d7 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
